<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">ChloeVibes — Feel every phrase.</title>
  <desc id="desc">A dark music console with cyan and magenta waveforms. Audio-reactive haptics for Windows and Android.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111824"/><stop offset=".55" stop-color="#0b0e17"/><stop offset="1" stop-color="#1b1027"/></linearGradient>
    <linearGradient id="signal" x1="0" x2="1"><stop stop-color="#6be4ff"/><stop offset=".48" stop-color="#aa8cff"/><stop offset="1" stop-color="#f26bd9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#b66ff7" stop-opacity=".17"/><stop offset="1" stop-color="#b66ff7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#90a5cc" stroke-opacity=".07"/></pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="edge"><rect width="1280" height="420" rx="22"/></clipPath>
    <path id="wave" d="M728 215H772L784 203L792 237L803 139L815 287L830 85L845 331L859 161L872 252L885 195L900 229L915 209L930 215H953L966 179L979 270L992 124L1006 306L1020 156L1035 245L1050 200L1066 223L1082 212L1097 215H1150L1164 197L1176 237L1189 158L1203 274L1217 205L1232 220H1280"/>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="1280" height="420" fill="url(#surface)"/>
    <rect x="690" width="590" height="420" fill="url(#grid)"/>
    <ellipse cx="1030" cy="214" rx="335" ry="285" fill="url(#glow)"/>
    <path d="M64 54H106" stroke="#78e3fb" stroke-width="3"/>
    <text x="120" y="60" fill="#a3b3c9" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3">AUDIO INTO EXPRESSION</text>
    <text x="60" y="170" fill="#f4f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-4">ChloeVibes</text>
    <text x="64" y="229" fill="#d7e2f2" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="300">Feel every phrase.</text>
    <text x="66" y="282" fill="#9baac1" font-family="Segoe UI,Arial,sans-serif" font-size="19">Musical haptics. Your rhythm. Your response.</text>
    <rect x="64" y="334" width="112" height="32" rx="16" fill="#182b37"/>
    <text x="120" y="355" text-anchor="middle" fill="#9de9f7" font-family="Segoe UI,Arial,sans-serif" font-size="13">WINDOWS</text>
    <rect x="186" y="334" width="112" height="32" rx="16" fill="#282038"/>
    <text x="242" y="355" text-anchor="middle" fill="#d8b1f7" font-family="Segoe UI,Arial,sans-serif" font-size="13">ANDROID</text>
    <text x="321" y="355" fill="#6f809a" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">OPEN SOURCE</text>
    <use href="#wave" fill="none" stroke="url(#signal)" stroke-width="9" opacity=".48" filter="url(#soft)"/>
    <use href="#wave" fill="none" stroke="url(#signal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="830" cy="85" r="4" fill="#94d4ff"/>
    <circle cx="1006" cy="306" r="4" fill="#d881ef"/>
    <path d="M726 354H1214" stroke="#32415a" stroke-opacity=".65"/>
    <text x="726" y="376" fill="#7686a0" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">ATTACK</text>
    <text x="860" y="376" fill="#7686a0" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">DECAY</text>
    <text x="989" y="376" fill="#7686a0" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">SUSTAIN</text>
    <text x="1141" y="376" fill="#7686a0" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">RELEASE</text>
    <rect x=".5" y=".5" width="1279" height="419" rx="22" fill="none" stroke="#344259" stroke-opacity=".7"/>
  </g>
</svg>
