[package]
name = "chloe-vibes"
version = "1.6.1"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
buttplug = { version = "9.0.9", features = ["server"] }
flume = "0.12.0"
clap = { version = "4.5.54", features = ["derive"] }
audio-capture = { path = "vendor/audio-capture" }
parking_lot = "0.12.5"
eframe = { version = "0.33.3", features = ["persistence"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }

# NEW: FFT for spectral analysis (the ChloeVibes engine upgrade)
rustfft = "6.2"

# Image loading for embedded logo
image = { version = "0.24", default-features = false, features = ["png"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
