name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust Build & Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --locked --all-targets
      - name: Test Windows capture backend
        run: cargo test -p audio-capture --locked
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chloe-vibes-windows
          path: target/release/chloe-vibes.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload parity golden artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-golden
          path: |
            tests/parity_golden.csv
            tests/parity_golden.csv.new
          if-no-files-found: ignore

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Run Kotlin unit + parity tests
        # Runs ParityTest.kt against the committed tests/parity_golden.csv so
        # Rust<->Kotlin engine drift fails CI. Placed before the APK build to
        # fail fast on a signal-engine regression.
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest
      - name: Build debug and optimized release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chloe-vibes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
